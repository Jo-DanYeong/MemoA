buildscript {
    configurations.classpath {
        resolutionStrategy.force("com.android.tools.build:gradle:8.10.0")
    }

    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // React Native Gradle plugin과 Kotlin 기반 외부 라이브러리용 버전입니다.
        // MemoA의 Android 애플리케이션 코드는 Java로만 작성합니다.
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.10.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            // expo-dev-client still declares this retired coordinate for Android tests.
            // Use the maintained React Native JSC artifact so IntelliJ can sync it.
            substitute module("org.webkit:android-jsc") using module("io.github.react-native-community:jsc-android:2026004.+")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
apply plugin: "expo-root-project"
