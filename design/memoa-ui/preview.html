<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemoA · UI/UX 디자인</title>
<style>
@font-face{font-family:'Noto Sans KR';src:local('Noto Sans KR');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#edf1f7;color:#172a46;font-family:'Noto Sans KR','Malgun Gothic',sans-serif}button,input,textarea,select{font:inherit}button,select{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #245bce;outline-offset:3px}.review-header{display:flex;align-items:center;gap:20px;padding:24px 36px;background:white;border-bottom:1px solid #ced7e4;position:sticky;top:0;z-index:8}.brand{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:700}.brand-mark{width:42px;height:42px;border-radius:14px;background:#245bce;color:white;display:grid;place-items:center}.review-header span{font-size:14px;color:#586980}.review-header .controls{margin-left:auto;display:flex;gap:8px;align-items:center}.review-header button,.review-header select,.review-button{min-height:44px;border:1px solid #ced7e4;background:white;border-radius:12px;padding:8px 14px;color:#172a46}.review-header button.selected{background:#e9f0ff;color:#245bce;border-color:#245bce}.layout{display:grid;grid-template-columns:258px 1fr 296px;gap:40px;max-width:1400px;margin:auto;padding:32px}.screen-list{height:calc(100vh -158px);overflow:auto;padding:0 10px 30px 0}.screen-list h2{font-size:13px;letter-spacing:.04em;color:#586980;margin:22px 0 8px}.screen-list button{display:block;width:100%;border:0;background:transparent;text-align:left;min-height:42px;padding:10px 12px;border-radius:10px;color:#586980;font-size:14px}.screen-list button.active{background:#245bce;color:#fff}.phone-wrap{display:flex;align-items:center;flex-direction:column;gap:16px}.phone{width:360px;height:800px;position:relative;overflow:hidden;border-radius:28px;box-shadow:0 0 0 1px #ced7e4,0 20px 70px #172a4616;background:#f6f8fc;flex:none}.phone .node{position:absolute;margin:0;padding:0;box-sizing:border-box;text-align:left;white-space:pre-wrap;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:0;border:0;background:transparent}.phone button.node{cursor:pointer}.phone button.node:hover{filter:brightness(.98)}.phone .node.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}.phone .node.scroll::-webkit-scrollbar{display:none}.phone .node.text{pointer-events:none}.phone input.node{background:transparent;color:#172a46!important;outline-offset:0}.phone textarea.node{resize:none;background:transparent;line-height:24px;font-size:16px;outline-offset:0}.phone .animate{animation:pulse 1.6s ease-in-out infinite}.phone input[type=search]::-webkit-search-cancel-button{display:none}@keyframes pulse{50%{transform:scale(.94);opacity:.6}}@media(prefers-reduced-motion:reduce){.phone .animate{animation:none}}.phone-caption{font-size:13px;color:#586980}.notes h1{font-size:22px;line-height:1.5;margin-top:0}.notes p{font-size:14px;color:#586980;line-height:1.8}.note-tag{font-size:13px;display:inline-block;border-radius:12px;padding:6px 10px;background:#e4f5ef;color:#216753}.notes .swatches{display:flex;gap:9px;margin:28px 0 16px}.swatches i{width:32px;height:32px;border-radius:50%;border:1px solid #172a460c}.notes a{color:#245bce;font-size:14px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px;padding:36px}.gallery .mini{background:white;padding:16px;border:1px solid #ced7e4;border-radius:20px;cursor:pointer}.gallery img{width:100%;height:auto;border:1px solid #ced7e4;border-radius:14px}.gallery h3{font-size:14px;line-height:1.5}.gallery p{font-size:12px;color:#586980}.toast{position:absolute;left:20px;bottom:105px;width:320px;padding:16px 20px;background:#172a46;color:white;border-radius:16px;font-size:14px;z-index:10;line-height:1.6}.demo-label{font-size:13px;color:#586980;text-align:center}.hidden{display:none!important}.timeline{padding:20px;background:#f6f8fc;border-radius:16px;margin:24px 0;font-size:14px;line-height:2;color:#245bce}.status-line{font-size:12px;margin:20px 0;color:#586980}.error-line{color:#b3261e!important}.home-icon{width:22px;height:22px}@media(max-width:1120px){.layout{grid-template-columns:220px 1fr;gap:28px}.notes{display:none}}@media(max-width:720px){.review-header{padding:14px 16px;gap:12px;flex-wrap:wrap}.review-header span{display:none}.review-header .controls{margin-left:0;width:100%;justify-content:space-between}.review-header select{max-width:180px}.layout{display:flex;flex-direction:column;padding:24px 0}.screen-list{display:none}.phone-wrap{width:100%}.phone{border-radius:20px}.gallery{padding:16px;grid-template-columns:repeat(2,minmax(140px,1fr));gap:12px}.gallery .mini{padding:8px}}@media(max-width:374px){.phone{transform:scale(.88);transform-origin:top center;margin-bottom:-96px}}
</style></head>
<body>
<header class="review-header"><div class="brand"><div class="brand-mark">M</div>MemoA</div><span>메시지를 일정으로, 간편하게</span><div class="controls"><select id="screen-select" aria-label="화면 선택"></select><button id="single" class="selected">화면 보기</button><button id="all">전체 시안</button><button id="play">흐름 체험</button></div></header>
<main class="layout" id="layout"><aside class="screen-list" id="screen-list"></aside><section class="phone-wrap"><div class="phone" id="phone" aria-label="MemoA 모바일 화면"></div><div class="phone-caption">360 × 800dp · 화면 안에서 스크롤할 수 있어요</div><div class="demo-label" id="demo-label">디자인 프로토타입 · AI 분석과 계정 기능은 샘플로 동작합니다</div></section><aside class="notes" id="notes"></aside></main><div class="gallery hidden" id="gallery"></div>
<script src="design-data.js"></script><script>
const D=window.MEMOA_DESIGN,byKey=Object.fromEntries(D.screens.map(s=>[s.key,s]));let current='home',play=false,timer=null,committed=null;const values={},toggles={};let rem='10분 전',pickedDay=11,month=9;
const $=id=>document.getElementById(id);const color=k=>D.colors[k]||k;const escapeHtml=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function create(n){const el=document.createElement(n.go&&!n.edit&&!n.textarea?'button':n.kind==='text'?'div':'div');el.className='node'+(n.kind==='text'?' text':'')+(n.scroll?' scroll':'')+(n.animate?' animate':'');el.dataset.node=n.id;el.dataset.name=n.name;Object.assign(el.style,{left:(n.x||0)+'px',top:(n.y||0)+'px',width:n.w+'px',height:n.h+'px',borderRadius:(n.radius||0)+'px',background:n.bg?color(n.bg):'transparent',opacity:n.opacity??1,border:n.stroke?`${n.strokeWidth||1}px solid ${color(n.stroke)}`:'none'});if(n.kind==='text'){el.textContent=n.text;Object.assign(el.style,{fontSize:n.size+'px',fontWeight:n.weight,lineHeight:(n.h/n.text.split('\n').length)+'px',color:color(n.color),textAlign:n.align});}else if(n.kind==='icon'){el.innerHTML=D.icons[n.icon].replace(/#172A46/gi,color(n.color));}else{(n.children||[]).forEach(c=>el.appendChild(create(c)));}
if(n.go){el.setAttribute('aria-label',n.name.replace(/^(按钮|버튼|탭) \/ /,''));el.addEventListener('click',e=>{e.stopPropagation();act(n.go)});}if(n.edit&&!n.textarea){const inp=document.createElement('input');inp.className='node';inp.setAttribute('aria-label',n.name.replace('입력 / ',''));inp.type=n.inputType==='password'?'password':'text';inp.value=values[n.edit]??(n.overrides?.value==='••••••••'?'MemoA2026':n.overrides?.value||'');if(inp.value.includes('선택해 주세요')||inp.value.includes('입력해 주세요'))inp.value='';inp.placeholder=n.overrides?.value||'입력해 주세요';Object.assign(inp.style,{left:'16px',top:'31px',width:(n.w-32)+'px',height:'28px',fontSize:'16px',lineHeight:'24px'});const old=el.querySelectorAll('.text')[1];if(old)old.style.visibility='hidden';inp.oninput=()=>{values[n.edit]=inp.value;validateReview()};el.appendChild(inp);}
if(n.textarea){const inp=document.createElement('textarea');inp.className='node';inp.setAttribute('aria-label',n.name);inp.value=n.edit?values[n.edit]??n.value:values.message??n.value;Object.assign(inp.style,{left:'16px',top:n.edit?'36px':'48px',width:(n.w-32)+'px',height:(n.h-(n.edit?48:96))+'px'});const old=el.querySelectorAll('.text')[1];if(old)old.style.visibility='hidden';inp.oninput=()=>{values[n.edit||'message']=inp.value;if(current==='input-empty'&&inp.value.trim())enablePrimary()};el.appendChild(inp);}
if(n.search){const inp=document.createElement('input');inp.type='search';inp.className='node';inp.placeholder='일정 검색';inp.setAttribute('aria-label','일정 검색');Object.assign(inp.style,{left:'46px',top:'14px',width:'196px',height:'28px',fontSize:'16px'});el.querySelector('.text').style.visibility='hidden';inp.oninput=()=>{const q=inp.value.trim();document.querySelectorAll('[data-name="일정 카드"]').forEach(c=>c.style.display=c.textContent.includes(q)?'block':'none');};inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim())go('search-empty')};el.appendChild(inp);}
return el;}
function enablePrimary(){const b=[...$('phone').querySelectorAll('[data-name="버튼 / AI로 분석하기"]')][0];if(b){b.style.background=D.colors.blue;b.querySelector('.text').style.color='white';b.onclick=()=>act('analyzing');b.setAttribute('role','button');b.setAttribute('aria-label','AI로 분석하기');}}
function validateReview(){if(current!=='result-review')return;const ok=values.date&&/^([01]\d|2[0-3]):[0-5]\d$/.test(values.time||'');const b=$('phone').querySelector('[data-name="버튼 / 일정 저장"]');if(b&&ok){b.style.background=D.colors.blue;b.querySelector('.text').style.color='white';b.onclick=()=>act('saved');}}
function toast(s){$('phone').querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=s;$('phone').appendChild(t);setTimeout(()=>t.remove(),2400);}
function act(a){if(a==='paste'){navigator.clipboard?.readText().then(t=>{values.message=t;go(current)}).catch(()=>toast('붙여넣기 권한을 허용하거나 직접 입력해 주세요.'));return;}if(a==='analyzing'){const v=values.message;if(v!==undefined&&!v.trim()){toast('분석할 메시지를 입력해 주세요.');return;}play=true;go(a);return;}
if(a==='login-loading'){const email=values.email??'student@example.com',pw=values.password??'MemoA2026';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||pw.length<8){go('login-error');return;}play=true;go(a);return;}
if(a==='saved'){if(current==='manual'&&!values.title){toast('일정 제목을 입력해 주세요.');return;}const t=values.time;if(t&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)){toast('시간은 14:00처럼 HH:mm으로 입력해 주세요.');return;}committed={title:values.title||'팀 프로젝트 회의',date:values.date||'2026.09.11 (금)',time:values.time||'14:00',place:values.place||'학교 도서관 3층',preparation:values.preparation||'노트북, 발표 자료',description:values.description||'팀 프로젝트 진행 상황 및 발표 준비 회의'};go(a);return;}
if(a.startsWith('select-day:')){pickedDay=Number(a.split(':')[1]);go(pickedDay===11?'calendar':'calendar-empty');updateCalendar();return;}
if(a.startsWith('calendar-')){if(a==='calendar-prev')month--;if(a==='calendar-next')month++;if(a==='calendar-today'){month=9;pickedDay=7;}go('calendar');updateCalendar();return;}
if(a.startsWith('reminder-option:')){rem=a.slice(16);toast(rem+' 알림을 선택했어요.');return;}
if(a.startsWith('toggle-')){toggles[a]=!toggles[a];toast(toggles[a]?'설정을 변경했어요.':'설정을 원래대로 변경했어요.');return;}
if(byKey[a])go(a);else toast('선택한 설정을 적용했어요.');}
function updateCalendar(){const p=$('phone');p.querySelectorAll('.text').forEach(el=>{if(el.textContent==='2026년 9월')el.textContent=`2026년 ${month}월`;if(el.textContent.startsWith('9월 11일 금요일')||el.textContent.startsWith('9월 12일 토요일'))el.textContent=`${month}월 ${pickedDay}일`;});p.querySelectorAll('[data-name^="날짜 / "]').forEach(el=>{const day=+el.dataset.name.split(' / ')[1],selected=day===pickedDay;el.style.background=selected?D.colors.blue:day===7?D.colors.blueSoft:'transparent';el.querySelector('.text').style.color=selected?'white':day===7?D.colors.blue:D.colors.ink;});}
function go(key){clearTimeout(timer);current=key;$('gallery').classList.add('hidden');$('layout').classList.remove('hidden');$('single').classList.add('selected');$('all').classList.remove('selected');const s=byKey[key];$('phone').replaceChildren(create(s));$('screen-select').value=key;document.querySelectorAll('.screen-list button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));$('notes').innerHTML=`<span class="note-tag">${s.group}</span><h1>${s.name}</h1><p>${s.notes||'공통 디자인 시스템을 적용한 기본 화면입니다. 버튼을 눌러 연결된 흐름을 확인할 수 있습니다.'}</p><div class="timeline">메시지 입력 또는 공유<br>↓ AI 분석<br>↓ 사용자 확인·수정<br>↓ 일정 저장<br>캘린더와 목록에서 확인</div><div class="swatches">${['blue','blueSoft','mint','ink','surface'].map(c=>`<i style="background:${color(c)}"></i>`).join('')}</div><p>Material 3 기반<br>Noto Sans KR · 본문 14–16sp<br>48dp 이상 터치 영역<br>24시간제 HH:mm</p><a href="screens/${String(D.screens.indexOf(s)+1).padStart(2,'0')}-${key}.svg" download>현재 화면 SVG 다운로드</a><p class="status-line">AI가 추출한 샘플 날짜는 2026.09.07 기준 금요일인 2026.09.11입니다.</p>`;if(play&&s.next)timer=setTimeout(()=>go(s.next),key==='analyzing'?2400:key==='splash'?800:1000);history.replaceState(null,'','#'+key);window.dispatchEvent(new CustomEvent('memoa-screen',{detail:key}));}
const groups=[...new Set(D.screens.map(s=>s.group))];groups.forEach(group=>{const h=document.createElement('h2');h.textContent=group;$('screen-list').appendChild(h);const optgroup=document.createElement('optgroup');optgroup.label=group;$('screen-select').appendChild(optgroup);D.screens.filter(s=>s.group===group).forEach(s=>{const b=document.createElement('button');b.dataset.key=s.key;b.textContent=s.name;b.onclick=()=>go(s.key);$('screen-list').appendChild(b);const o=document.createElement('option');o.value=s.key;o.textContent=s.name;optgroup.appendChild(o);});});$('screen-select').onchange=e=>go(e.target.value);$('single').onclick=()=>go(current);$('all').onclick=()=>{$('gallery').classList.remove('hidden');$('layout').classList.add('hidden');$('all').classList.add('selected');$('single').classList.remove('selected');};$('play').onclick=()=>{play=true;go('splash')};$('gallery').innerHTML=D.screens.map((s,i)=>`<button class="mini" data-key="${s.key}"><img loading="lazy" src="screens/${String(i+1).padStart(2,'0')}-${s.key}.svg" alt="${escapeHtml(s.name)}"><h3>${s.name}</h3><p>${s.group}</p></button>`).join('');$('gallery').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.key));window.memoa={go,D,values,act};go(byKey[location.hash.slice(1)]?location.hash.slice(1):'home');
</script><script src="enhance.js"></script></body></html>
