

services:
  memoa-api:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: memoa-api:local
    container_name: memoa-api
    restart: unless-stopped
    networks:
      - memoa-network
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MEMOA_DATA_PATH: /data/memoa
      MEMOA_AI_ENDPOINT: ${MEMOA_AI_ENDPOINT:-}
      MEMOA_AI_API_KEY: ${MEMOA_AI_API_KEY:-}
      MEMOA_AI_PROVIDER: ${MEMOA_AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8
    volumes:
      - memoa-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  memoa-network:
    driver: bridge

volumes:
  memoa-data:
    driver: local
