spring:
  application:
    name: memoa-api
  datasource:
    url: jdbc:h2:file:${MEMOA_DATA_PATH:./data/memoa};DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

memoa:
  ai:
    endpoint: ${MEMOA_AI_ENDPOINT:}
    api-key: ${MEMOA_AI_API_KEY:}
